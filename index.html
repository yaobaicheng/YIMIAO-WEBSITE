<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="静态企业官网"><title>YOUR COMPANY</title><link rel="stylesheet" href="styles.css"></head>
<body>
<!-- 【A】顶部快捷栏。文字在 content.js > locales > 各语言 > utility 修改 -->
<div class="utility-bar"><span data-t="utility.tagline"></span><div><a href="#sustainability" data-t="utility.sustainability"></a><a href="#news" data-t="utility.careers"></a><a href="#contact" data-t="utility.contact"></a></div></div>
<!-- 【B】主导航。各项文字在 locales > nav 修改；导航锚点可改 href -->
<header class="site-header" id="top"><a class="brand" href="#top"><span class="brand-mark" data-brand>Y</span><span data-brand-name>YOUR COMPANY</span></a><nav class="main-nav"><a href="#about" data-t="nav.about"></a><a href="#products" data-t="nav.products"></a><a href="#solutions" data-t="nav.solutions"></a><a href="#support" data-t="nav.support"></a><a href="#news" data-t="nav.news"></a><a href="#contact" data-t="nav.contact"></a></nav><div class="header-tools"><select id="languageSelect" aria-label="Language"><option value="zh">中文</option><option value="en">EN</option><option value="id">ID</option></select><button class="menu-toggle" type="button" aria-label="菜单"><i></i><i></i></button></div></header>
<main>
<!-- 【C】首屏 Banner。图片：content.js > assets.hero。文字：locales > hero -->
<section class="hero" id="home"><div class="hero-image" id="heroImage"></div><div class="hero-overlay"></div><div class="hero-grid"></div><div class="hero-orb orb-one"></div><div class="hero-content"><p class="eyebrow" data-t="hero.eyebrow"></p><h1 data-html="hero.title"></h1><p class="hero-text" data-t="hero.text"></p><a class="button lime" href="#about"><span data-t="actions.learnMore"></span><b>↗</b></a></div><div class="hero-bottom"><span>SCROLL TO EXPLORE</span><i></i><span>01 / 09</span></div></section>
<!-- 【D】公司介绍与数据。文字和数字：locales > about/stats -->
<section class="intro section" id="about"><div><p class="eyebrow">ABOUT US</p><h2 data-html="about.title"></h2></div><div class="intro-copy"><p data-t="about.text"></p><a class="text-link" href="#global"><span data-t="actions.discover"></span><b>→</b></a></div><div class="stats" id="stats"></div></section>
<!-- 【E】企业愿景 Banner。图片：assets.vision；文字：locales > vision -->
<section class="vision" id="vision"><div class="vision-image" id="visionImage"></div><div class="vision-overlay"></div><div class="vision-content"><p class="eyebrow" data-t="vision.eyebrow"></p><h2 data-html="vision.title"></h2><a class="button outline" href="#contact"><span data-t="actions.learnMore"></span><b>↗</b></a></div><span class="vertical-label">INNOVATION · IN MOTION</span></section>
<!-- 【F】产品中心。每张产品图片/文字：content.js > products；可无限复制新增 -->
<section class="products section" id="products"><div class="section-top"><div><p class="eyebrow">PRODUCTS</p><h2 data-html="products.title"></h2></div><a class="text-link" href="#contact"><span data-t="actions.productInquiry"></span><b>→</b></a></div><div class="product-filter" id="productFilter"></div><div class="product-grid" id="productsGrid"></div><button class="load-more" id="loadMore" type="button"><span data-t="actions.loadMore"></span><b>↓</b></button></section>
<!-- 【G】行业方案。背景图/内容：content.js > solutions -->
<section class="solutions" id="solutions"><div class="solutions-heading section"><p class="eyebrow">SOLUTIONS</p><h2 data-html="solutions.title"></h2><p data-t="solutions.text"></p></div><div class="solution-list" id="solutionsList"></div></section>
<!-- 【H】服务支持。内容：content.js > support -->
<section class="support section" id="support"><div class="section-top"><div><p class="eyebrow">SERVICE SUPPORT</p><h2 data-html="support.title"></h2></div></div><div class="support-grid" id="supportGrid"></div></section>
<!-- 【I】全球布局。地图图片：assets.globalMap；数字/文字：locales > global -->
<section class="global" id="global"><div class="global-map" id="globalMap"></div><div class="global-content"><p class="eyebrow">GLOBAL PRESENCE</p><h2 data-html="global.title"></h2><p data-t="global.text"></p><div class="global-stats" id="globalStats"></div></div></section>
<!-- 【J】可持续发展背景图。图片：assets.sustainability；文字：locales > sustainability -->
<section class="sustainability" id="sustainability"><div class="sustainability-image" id="sustainabilityImage"></div><div class="sustainability-content"><p class="eyebrow">SUSTAINABILITY</p><h2 data-html="sustainability.title"></h2><p data-t="sustainability.text"></p><a class="button outline" href="#contact"><span data-t="actions.learnMore"></span><b>↗</b></a></div></section>
<!-- 【K】企业画廊。每张图片：content.js > gallery -->
<section class="gallery section"><div class="section-top"><div><p class="eyebrow">OUR WORLD</p><h2 data-t="gallery.title"></h2></div><p class="hint">assets/gallery-*.jpg</p></div><div class="gallery-grid" id="galleryGrid"></div></section>
<!-- 【L】新闻。文字和跳转链接：content.js > news -->
<section class="news section" id="news"><div class="section-top"><div><p class="eyebrow">NEWSROOM</p><h2 data-t="news.title"></h2></div><a class="text-link" href="#contact"><span data-t="actions.viewAll"></span><b>→</b></a></div><div class="news-list" id="newsList"></div></section>
<!-- 【M】联系我们。外链和二维码：content.js > contactLinks。纯展示，无表单提交 -->
<section class="contact" id="contact"><div class="contact-copy"><p class="eyebrow">CONTACT US</p><h2 data-t="contact.title"></h2><p data-t="contact.text"></p><a class="contact-main" data-contact-main href="mailto:hello@example.com"><span data-t="actions.contactUs"></span><b>↗</b></a></div><div class="contact-links" id="contactLinks"></div></section>
</main>
<!-- 【N】页脚。地址、电话和邮箱：content.js > company.contact -->
<footer><a class="brand" href="#top"><span class="brand-mark" data-brand>Y</span><span data-brand-name>YOUR COMPANY</span></a><div class="footer-contact" id="footerContact"></div><div class="footer-bottom"><span data-copyright></span><a href="#top" data-t="actions.backTop"></a></div></footer>
<script src="content.js"></script><script src="main.js"></script></body></html>
